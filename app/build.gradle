apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlin-android-extensions'

// Apply the Crashlytics Gradle plugin
apply plugin: 'com.google.firebase.crashlytics'

// Apply the Performance Monitoring plugin
apply plugin: 'com.google.firebase.firebase-perf'

apply plugin: 'com.google.gms.google-services'

android {
    signingConfigs {
        release {
            storeFile file('C:\\Android\\AndroidProjects\\readmanga_key')
            storePassword 'B324xw'
            keyAlias = 'key0'
            keyPassword 'B324xw'
        }
    }

    dataBinding {
        enabled = true
    }

    compileSdkVersion 30
    defaultConfig {

        vectorDrawables {
            useSupportLibrary = true
        }
        
        applicationId "ru.garretech.readmanga"
        minSdkVersion 19
        targetSdkVersion 30
        versionCode 22
        versionName "1.1.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
        signingConfig signingConfigs.release
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    buildToolsVersion = '29.0.3'
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas".toString())
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.3.72'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.browser:browser:1.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation "androidx.drawerlayout:drawerlayout:1.1.1"

    implementation 'androidx.room:room-runtime:2.2.6'
    implementation 'androidx.room:room-rxjava2:2.2.6'
    kapt "android.arch.persistence.room:compiler:1.1.1"
    annotationProcessor "android.arch.persistence.room:compiler:1.1.1"

    implementation 'org.jsoup:jsoup:1.13.1'

    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.46'

    // Last version that supports android 4.4
    implementation 'com.squareup.okhttp3:okhttp:3.12.2'

    implementation 'com.shawnlin:number-picker:2.4.8'

    implementation 'io.reactivex.rxjava2:rxjava:2.2.20'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    implementation 'com.google.code.gson:gson:2.8.6'

    implementation 'com.yandex.ads.mediation:mobileads-admob:1.16.0'
    implementation 'com.yandex.android:mobileads:3.1.1'
    implementation 'com.yandex.android:mobmetricalib:3.16.2'
    implementation 'com.yandex.ads.mediation:mobileads-mytarget:1.11.0'
    implementation 'com.my.target:mytarget-sdk:5.5.6'

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.1'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    // Firebase + Crashlytics
    // Recommended: Add the Firebase SDK for Google Analytics.
    implementation 'com.google.firebase:firebase-analytics-ktx:18.0.0'
    implementation 'com.google.firebase:firebase-crashlytics-ktx:17.3.0'
    implementation 'com.google.firebase:firebase-perf:19.0.11'


    debugImplementation 'im.dino:dbinspector:4.0.0@aar'

    implementation ('com.github.piasy:BigImageViewer:1.7.0') {
        exclude group: 'com.squareup.okhttp3'
    }

    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

}

repositories {
    mavenCentral()

    maven { url 'https://maven.fabric.io/public' }
}
